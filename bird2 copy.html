    // Video handling
    function openVideoEmbed(videoID, startTime=0, endTime=0, sectionsStr="") {
      currentSections = parseSections(sectionsStr);
      console.log("Parsed sections:", currentSections);
      const actualStartTime = currentSections.length > 0 ? currentSections[0].start : startTime;
      
      currentVideoID = videoID;
      currentStartTime = actualStartTime;
      currentSectionIndex = 0; isPaused=false; lastCheckedTime=-1;
      videoModal.style.display = "flex";
      
      setTimeout(setupYouTubeListener, 100);
    }
    function setupYouTubeListener() {
      console.log("Setting up YouTube listener...");
      if (window.YT===undefined) { 
        const tag=document.createElement('script'); 
        tag.src="https://www.youtube.com/iframe_api"; 
        document.body.appendChild(tag); 
      }
      const iv = setInterval(()=>{
        if (window.YT && window.YT.Player) { 
          clearInterval(iv);
          console.log("YouTube API ready, creating player...");
          try { 
            // Destroy existing player if it exists
            if (videoPlayer && videoPlayer.destroy) {
              videoPlayer.destroy();
            }
            
            // Remove old iframe and create new one
            const oldIframe = document.getElementById('video-iframe');
            if (oldIframe) {
              oldIframe.remove();
            }
            
            // Create new iframe element
            const newIframe = document.createElement('div');
            newIframe.id = 'video-iframe';
            const container = document.getElementById('video-modal-content');
            container.insertBefore(newIframe, container.firstChild);
            
            videoPlayer = new YT.Player('video-iframe', { 
              height: '480',
              width: '100%',
              videoId: currentVideoID,
              playerVars: {
                autoplay: 1,
                start: Math.floor(currentStartTime),
                enablejsapi: 1
              },
              events: { 
                onReady: onPlayerReady, 
                onStateChange: onPlayerStateChange 
              } 
            }); 
          } catch(e) { 
            console.error("Error creating player:", e); 
          }
        }
      }, 100);
    }
    function onPlayerReady(e) {
      console.log("Player ready!");
      try { e.target.unMute(); e.target.setVolume(50); e.target.playVideo(); } catch(e) { console.error("Error in onPlayerReady:", e); }
    }
    function onPlayerStateChange(e) { 
      console.log("Player state changed:", e.data);
      if (e.data === window.YT.PlayerState.PLAYING) monitorPlayback(); 
    }
    function monitorPlayback() {
      // Stop monitoring if video modal is closed
      if (videoModal.style.display === 'none') {
        console.log("Video closed, stopping monitor");
        return;
      }
      
      if (!videoPlayer || !videoPlayer.getCurrentTime) { 
        console.log("Player not ready yet...");
        setTimeout(monitorPlayback,100); 
        return; 
      }
      
      if (currentSections.length===0) { 
        console.log("No sections, stopping monitor");
        setTimeout(monitorPlayback,500); 
        return; 
      }
      
      const t = videoPlayer.getCurrentTime();
      const sec = currentSections[currentSectionIndex];
      
      if (!sec) {
        console.log("No current section found");
        return;
      }
      
      // Log current state every second
      if (Math.floor(t) !== Math.floor(lastCheckedTime)) {
        console.log(`Time: ${t.toFixed(1)}s, Section ${currentSectionIndex}: ${sec.start}-${sec.end}, autoSkip: ${sec.autoSkip}`);
      }
      
      // Check if we've reached the end of current section FIRST
      if (t>=sec.end && lastCheckedTime<sec.end) {
        console.log(`Reached end of section at ${t}s. Section:`, sec, `Next index:`, currentSectionIndex + 1);
        if (sec.autoSkip && currentSectionIndex<currentSections.length-1) {
          // Skip to next section
          currentSectionIndex++;
          let next = currentSections[currentSectionIndex];
          console.log("Skipping to next section:", next);
          // Keep skipping through consecutive auto-skip gap sections
          while (next && next.isGap && currentSectionIndex < currentSections.length - 1) {
            const nextNext = currentSections[currentSectionIndex + 1];
            // Check if this is a gap section (ends where next begins)
            if (nextNext && Math.abs(next.end - nextNext.start) < 1) {
              console.log("Skipping through gap section:", next);
              currentSectionIndex++;
              next = currentSections[currentSectionIndex];
            } else {
              break;
            }
          }
          console.log("Final seek to:", next.start);
          videoPlayer.seekTo(next.start);
          lastCheckedTime = next.start;
        } else if (currentSectionIndex<currentSections.length-1) {
          // Pause and prompt, but find the actual playable section (skip gaps)
          videoPlayer.pauseVideo(); 
          isPaused=true; 
          let nextIndex = currentSectionIndex + 1;
          let next = currentSections[nextIndex];
          // Skip through auto-skip gap sections to find the real next section
          while (next && next.isGap && nextIndex < currentSections.length - 1) {
            const nextNext = currentSections[nextIndex + 1];
            if (nextNext && Math.abs(next.end - nextNext.start) < 1) {
              console.log("Prompt: Skipping through gap section:", next);
              nextIndex++;
              next = currentSections[nextIndex];
            } else {
              break;
            }
          }
          if (next) showSectionPrompt(next.start, nextIndex);
        }
      } else {
        // Update section index if we've moved to a different section (for manual seeking)
        for (let i = 0; i < currentSections.length; i++) {
          const s = currentSections[i];
          if (t >= s.start && t < s.end && i !== currentSectionIndex) {
            currentSectionIndex = i;
            break;
          }
        }
      }
      
      if (isPaused && videoPlayer.getPlayerState()===window.YT.PlayerState.PLAYING) {
        isPaused=false; if (currentSectionIndex<currentSections.length-1) { currentSectionIndex++; const next=currentSections[currentSectionIndex]; videoPlayer.seekTo(next.start); }
      }
      lastCheckedTime = t;
      setTimeout(monitorPlayback, (videoPlayer.getPlayerState()===window.YT.PlayerState.PLAYING || (isPaused && currentSections.length>0)) ? 100 : 500);
    }
    function showSectionPrompt(nextStart, nextIndex) {
      videoPromptText.textContent = `Section ended. Press Enter or click to jump to ${Math.floor(nextStart)}s`;
      videoPrompt.dataset.nextStart = nextStart; videoPrompt.dataset.nextIndex = nextIndex; videoPrompt.style.display = 'block'; setTimeout(()=>{ try{ videoPromptContinue.focus(); }catch{} }, 20);
      document.addEventListener('keydown', promptKeyHandler);
    }
    function hideSectionPrompt() { videoPrompt.style.display='none'; delete videoPrompt.dataset.nextStart; delete videoPrompt.dataset.nextIndex; document.removeEventListener('keydown', promptKeyHandler); }
    function promptKeyHandler(e){ if(e.key==='Enter' && videoPrompt.style.display==='block'){ e.preventDefault(); videoPromptContinue.click(); } if(e.key==='Escape' && videoPrompt.style.display==='block'){ e.preventDefault(); videoPromptCancel.click(); } }

    videoPromptContinue.addEventListener('click', ()=>{ 
      const nextStart=parseFloat(videoPrompt.dataset.nextStart||0); 
      const nextIndex=parseInt(videoPrompt.dataset.nextIndex||0,10); 
      console.log("Prompt continue clicked. Jump to:", nextStart, "Section:", nextIndex);
      hideSectionPrompt(); 
      if(videoPlayer){ 
        currentSectionIndex=nextIndex; 
        videoPlayer.seekTo(nextStart); 
        try{
          videoPlayer.playVideo();
        }catch{} 
        isPaused=false; 
      } 
    });
    videoPromptCancel.addEventListener('click', hideSectionPrompt);

    function closeVideo(){ 
      videoModal.style.display='none'; 
      if (videoPlayer && videoPlayer.destroy) {
        videoPlayer.destroy();
        videoPlayer = null;
      }
      hideSectionPrompt(); 
    }
    videoClose.addEventListener('click', closeVideo);

    // Delete mode handlers (click to toggle; click again to delete)
    deleteModeBtn.addEventListener('click', async () => {
      if (!deleteMode) {
        // Enter delete mode
        deleteMode = true;
        selectedItems.clear();
        confirmDeleteBtn.style.display = 'inline-block';
        columnsDiv.classList.add('delete-mode-active');
        deleteModeBtn.classList.add('active');
        console.log('Delete mode activated');
        await loadPageItems();
      } else {
        // Second click: delete selected items and exit
        if (selectedItems.size > 0) {
          console.log('Deleting items via X button:', Array.from(selectedItems));
          for (const itemId of selectedItems) {
            await deleteDoc(doc(db, NOTES_COLLECTION, itemId));
          }
        }
        deleteMode = false;
        selectedItems.clear();
        confirmDeleteBtn.style.display = 'none';
        columnsDiv.classList.remove('delete-mode-active');
        deleteModeBtn.classList.remove('active');
        await loadPageItems();
        console.log('Delete mode exited after deletion');
      }
    });

    function updateCheckModeUI() {
      checkModeBtn.style.outline = checkMode ? '2px solid #fff' : 'none';
      resetNowBtn.style.display = PAGE === 'Now' ? 'inline-block' : 'none';
    }

    confirmDeleteBtn.addEventListener('click', async () => {
      console.log('Deleting items:', Array.from(selectedItems));
      // Delete all selected items
      for (const itemId of selectedItems) {
        await deleteDoc(doc(db, NOTES_COLLECTION, itemId));
      }
      // Exit delete mode
      deleteMode = false;
      selectedItems.clear();
      confirmDeleteBtn.style.display = 'none';
      columnsDiv.classList.remove('delete-mode-active');
      await loadPageItems();
    });

    // Global click: clicking outside items or overlays deselects selections
    document.addEventListener('click', (e) => {
      // Ignore clicks inside the modal/overlays
      if (e.target.closest('#modal') || e.target.closest('#lists-overlay') || e.target.closest('#video-modal')) return;
      const clickedItem = e.target.closest('.item');
      // If click is not on an item, clear move selection and (in non-delete) selections
      if (!clickedItem) {
        if (selectedMoveItem) {
          const prev = document.querySelector(`[data-id="${selectedMoveItem}"]`);
          if (prev) prev.classList.remove('move-selected');
          selectedMoveItem = null;
        }
        if (deleteMode) {
          // Clear visual selection of items
          selectedItems.clear();
          document.querySelectorAll('.item').forEach(it => { it.style.background = ''; });
        }
      }
    }, true);

    // Check mode
    checkModeBtn.addEventListener('click', async () => {
      if (checkMode) {
        // Exit check mode, move checked items to Now
        for (const itemId of checkedItems) {
          await setDoc(doc(db, NOTES_COLLECTION, itemId), { page: 'Now' }, { merge: true });
        }
        checkedItems.clear();
        checkMode = false;
        updateCheckModeUI();
        await loadPageItems();
      } else {
        // Enter check mode
        checkMode = true;
        updateCheckModeUI();
        await loadPageItems();
      }
    });

    // Reset Now button
    resetNowBtn.addEventListener('click', async () => {
      if (PAGE === 'Now') {
        const q = query(collection(db, NOTES_COLLECTION), where("page", "==", "Now"));
        const snap = await getDocs(q);
        for (const d of snap.docs) {
          await deleteDoc(doc(db, NOTES_COLLECTION, d.id));
        }
        await loadPageItems();
      }
    });

    openResetPageBtn.addEventListener('click', () => {
      const siteKeyParam = SITE_KEY ? `siteKey=${encodeURIComponent(SITE_KEY)}&` : "";
      window.location.href = `bird2 tags.html?${siteKeyParam}page=home`;
    });

    pageNotesBtn.addEventListener("click", async () => {
      const currentPage = PAGE;
      openNotesPage = currentPage;
      const ref = doc(db, PAGE_NOTES_COLLECTION, getPageNotesDocId(currentPage));
      const snap = await getDoc(ref);
      const cloudText = snap.exists() ? (snap.data().text || "") : "";
      const draftText = safeLocalStorageGet(getPageNotesDraftStorageKey(currentPage)) || "";
      pageNotesText.value = draftText || cloudText;
      pageNotesOverlay.style.display = "flex";
      pageNotesText.focus();
    });

    pageNotesText.addEventListener("input", () => {
      if (!openNotesPage) return;
      safeLocalStorageSet(getPageNotesDraftStorageKey(openNotesPage), pageNotesText.value || "");
      queuePageNotesSave();
    });

    pageNotesOverlay.addEventListener("click", async (e) => {
      if (e.target !== pageNotesOverlay) return;
      await closePageNotesOverlay();
    });

    window.addEventListener("beforeunload", () => {
      if (!openNotesPage) return;
      safeLocalStorageSet(getPageNotesDraftStorageKey(openNotesPage), pageNotesText.value || "");
    });

    // Arrow button handlers
    arrowUp.addEventListener('click', () => moveItem('up'));
    arrowDown.addEventListener('click', () => moveItem('down'));
    arrowLeft.addEventListener('mousedown', setPendingArrowTitleEdit);
    arrowLeft.addEventListener('click', async () => {
      if (selectedMoveItem) {
        await moveItem('left');
        return;
      }
      const titleCtx = consumeArrowTitleEditContext();
      if (titleCtx?.type === 'column') {
        await moveColumn(titleCtx.colIdx, -1);
        return;
      }
      if (titleCtx?.type === 'page') {
        await movePage(titleCtx.pageName, -1);
        return;
      }
      await moveItem('left');
    });
    arrowRight.addEventListener('mousedown', setPendingArrowTitleEdit);
    arrowRight.addEventListener('click', async () => {
      if (selectedMoveItem) {
        await moveItem('right');
        return;
      }
      const titleCtx = consumeArrowTitleEditContext();
      if (titleCtx?.type === 'column') {
        await moveColumn(titleCtx.colIdx, 1);
        return;
      }
      if (titleCtx?.type === 'page') {
        await movePage(titleCtx.pageName, 1);
        return;
      }
      await moveItem('right');
    });
    columnsDiv.addEventListener("click", (e) => {
      if (e.target === columnsDiv) {
        clearMoveSelection();
      }
    });

    async function moveItem(direction) {
      if (!selectedMoveItem) {
        console.log('No item selected for moving');
        return;
      }

      const itemId = selectedMoveItem;
      const docRef = doc(db, NOTES_COLLECTION, itemId);
      const docSnap = await getDoc(docRef);
      if (!docSnap.exists()) return;

      const itemData = docSnap.data();
      const currentCol = itemData.col ?? 0;
      const currentOrder = itemData.order ?? 0;

      // Get all items
      const q = query(collection(db, NOTES_COLLECTION), where("page", "==", PAGE));
      const snap = await getDocs(q);
      const allItems = [];
      snap.forEach(d => {
        const it = d.data();
        it.id = d.id;
        allItems.push(it);
      });

      if (direction === 'up') {
        // Move up within the same column
        const colItems = allItems.filter(it => (it.col ?? 0) === currentCol).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        const currentIndex = colItems.findIndex(it => it.id === itemId);
        if (currentIndex > 0) {
          // Swap order with previous item
          const prevItem = colItems[currentIndex - 1];
          await setDoc(doc(db, NOTES_COLLECTION, itemId), { order: prevItem.order ?? 0 }, { merge: true });
          await setDoc(doc(db, NOTES_COLLECTION, prevItem.id), { order: currentOrder }, { merge: true });
        }
      } else if (direction === 'down') {
        // Move down within the same column
        const colItems = allItems.filter(it => (it.col ?? 0) === currentCol).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
        const currentIndex = colItems.findIndex(it => it.id === itemId);
        if (currentIndex < colItems.length - 1) {
          // Swap order with next item
          const nextItem = colItems[currentIndex + 1];
          await setDoc(doc(db, NOTES_COLLECTION, itemId), { order: nextItem.order ?? 0 }, { merge: true });
          await setDoc(doc(db, NOTES_COLLECTION, nextItem.id), { order: currentOrder }, { merge: true });
        }
      } else if (direction === 'left') {
        // Move to top of left column
        if (currentCol > 0) {
          const targetCol = currentCol - 1;
          const colItems = allItems.filter(it => (it.col ?? 0) === targetCol);
          const minOrder = colItems.length > 0 ? Math.min(...colItems.map(it => it.order ?? 0)) : 0;
          await setDoc(doc(db, NOTES_COLLECTION, itemId), { col: targetCol, order: minOrder - 1 }, { merge: true });
        }
      } else if (direction === 'right') {
        // Move to top of right column
        const targetCol = currentCol + 1;
        const colItems = allItems.filter(it => (it.col ?? 0) === targetCol);
        const minOrder = colItems.length > 0 ? Math.min(...colItems.map(it => it.order ?? 0)) : 0;
        await setDoc(doc(db, NOTES_COLLECTION, itemId), { col: targetCol, order: minOrder - 1 }, { merge: true });
      }

      await loadPageItems();
    }

    // Page add handler
    addPageBtn.addEventListener("click", async () => {
      const name = prompt("Enter new page name:");
      if (name && name.trim()) {
        const pageName = name.trim();
        if (pageName === "Audio") {
          await switchPage("Audio");
          return;
        }
        const pagesSnap = await getDocs(collection(db, PAGES_COLLECTION));
        const rows = [];
        pagesSnap.forEach((d) => {
          const data = d.data();
          const rawName = (data.name || d.id || "").trim();
          if (!rawName) return;
          const parsedOrder = Number(data.order);
          rows.push({ name: rawName, order: Number.isFinite(parsedOrder) ? parsedOrder : null });
        });
        const ordered = getOrderedPages(rows);
        const nextOrder = ordered.length ? ordered[ordered.length - 1].normalizedOrder + 1 : 0;
        await setDoc(doc(db, PAGES_COLLECTION, pageName), { name: pageName, order: nextOrder }, { merge: true });
        await switchPage(pageName);
      }
    });

    bindCurrentPageTitleLongPress();

    // Init
    updatePageTitleUI();
    updateCheckModeUI();
    loadPages().then(() => loadPageItems());
  </script>
</body>
</html>
