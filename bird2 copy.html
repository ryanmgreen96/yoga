<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bird — Template</title>
  <style>
    :root {
      --bg: #c41e3a;
      --gold: gold;
      --white: #fff;
      --green: #2b6b2b;
      --green-hover: #1f4f1f;
      --beige: #e8d9a7;
      --gap: 10px;
    }
    * { box-sizing: border-box; }
    [hidden] { display:none !important; }
    body { margin:0; background: var(--bg); color: var(--white); font-family: system-ui, sans-serif; }
    .page { padding: 16px; }

    /* Header (top-left) */
    .header { display:flex; align-items:center; gap:8px; flex-wrap: wrap; }
    .current-page-title { color: var(--gold); font-weight: 800; font-size: 18px; min-width: 90px; }
    .page-tabs { display:flex; align-items:center; gap:8px; flex-wrap: wrap; margin-left: 8px; }
    .page-tab { color: var(--gold); background: transparent; border: 1px solid rgba(255,215,0,0.45); border-radius: 6px; padding: 3px 8px; font-weight: 700; cursor: pointer; }
    .page-tab:hover { background: rgba(255,215,0,0.12); }
    .page-tab.active { background: rgba(255,215,0,0.2); border-color: var(--gold); }
    .header a { color: var(--gold); font-weight: 700; text-decoration: none; }
    .header a:hover { text-decoration: underline; }
    .delete-mode-btn { background: #8b0000; color: #fff; border: none; border-radius: 6px; padding: 4px 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
    .delete-mode-btn:hover { background: #a00000; }
    .confirm-delete-btn { background: var(--green); color: #fff; border: none; border-radius: 6px; padding: 4px 8px; font-weight: 600; cursor: pointer; font-size: 13px; display: none; }
    .confirm-delete-btn:hover { background: var(--green-hover); }
    .delete-mode-active .btn-add { background: #8b0000; }
    .delete-mode-btn.active { box-shadow: 0 0 0 2px #fef08a; background: #b30000; }
    .arrow-btn { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 4px 10px; font-weight: 600; cursor: pointer; font-size: 16px; }
    .arrow-btn:hover { background: #1d4ed8; }
    .reset-page-btn { background: #6b21a8; color: #fff; border: none; border-radius: 6px; padding: 4px 10px; font-weight: 700; cursor: pointer; font-size: 13px; }
    .reset-page-btn:hover { background: #581c87; }
    .item.move-selected { background: #eab308; box-shadow: 0 0 0 2px #fef08a; }

    /* Rows layout */
    .columns { display:flex; flex-direction: column; gap: 20px; margin-top: 16px; }
    .column { display:flex; flex-direction:row; align-items: flex-start; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
    .column-header { display: none; }
    .column-title-slot { flex: 1; min-width: 0; }
    .column-title-display { width: 100%; text-align: center; color: #e8d9a7; font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.2; min-height: 28px; padding: 2px 6px; user-select: none; cursor: default; }
    .column-title-display:empty::before { content: " "; }
    .column-title-edit { width: 100%; background: rgba(255,255,255,0.12); color: #e8d9a7; border: 1px solid rgba(255,255,255,0.25); border-radius: 6px; padding: 4px 8px; text-align: center; font-family: Georgia, "Times New Roman", serif; font-size: 18px; }
    .column-title-edit::placeholder { color: rgba(232,217,167,0.75); }
    .add-column-btn { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 6px 12px; font-weight: 700; cursor: pointer; font-size: 18px; line-height: 1; align-self: flex-start; margin-top: 4px; }
    .add-column-btn:hover { background: #1d4ed8; }
    .add-row-btn { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-weight: 700; cursor: pointer; font-size: 16px; margin-top: 12px; }
    .add-row-btn:hover { background: #1d4ed8; }
    
    /* Mobile layout */
    @media (max-width: 700px) {
      .columns { 
        display: flex;
        flex-direction: column;
        gap: 20px; 
      }
      .column { 
        flex-direction: row;
        flex-wrap: wrap;
      }
    }
    .item { background: transparent; border-radius: 5px; padding: 0; display:flex; flex-direction: column; gap: 2px; border: none; overflow: visible; }
    .item-checkbox { width: 17px; height: 17px; margin-right: 6px; cursor: pointer; }
    .item-title-row { display: flex; align-items: flex-start; min-height: 34px; padding: 2px 1px 0 1px; overflow: visible; }
    .item-title { color: var(--white); text-decoration:none; font-size: 14px; cursor:pointer; margin: 0; display: block; line-height: 1.15; white-space: normal; word-break: break-word; overflow: visible; }
    .item-title.text-only { color: var(--beige); }
    .thumbnail-crop { width: 163px; height: 98px; margin-top: 0; border-radius: 4px; overflow: hidden; }
    .item-thumbnail { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; transform: scale(1.288); transform-origin: center; }
    /* List link style */
    .list-link { color: var(--beige); text-decoration: none; font-weight: 700; }
    .list-link:hover { text-decoration: underline; color: var(--gold); }
    /* Make add buttons not full width and center them */
    .add-row-btn, .add-column-btn { width: auto; align-self: center; }
    .column-add-btn { padding: 4px 10px; }

    .toolbar { display:flex; gap:6px; padding: 4px 0 0 0; }
    .btn { border: none; border-radius: 6px; padding: 4px 8px; font-weight:600; cursor:pointer; font-size: 13px; }
    .btn-add { background: var(--green); color: #fff; }
    .btn-add:hover { background: var(--green-hover); }
    .split-separator { color: rgba(255, 255, 255, 0.7); margin: 0 4px; font-weight: 900; cursor: pointer; font-size: 16px; }
    .split-separator:hover { color: rgba(255, 255, 255, 0.9); }

    .group-gap { margin-top: 25px; }

    /* Modal */
    #modal { display:none; position:fixed; inset:0; background: rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:9999; }
    #modal-content { background:#222; border-radius:12px; padding:16px; width: 520px; max-width: 92%; color:#eee; }
    #modal h3 { margin:0 0 8px 0; color: var(--gold); font-size: 16px; text-align:center; }
    .inputs { display:flex; flex-direction:column; gap:8px; }
    .inputs-row { display:flex; gap:8px; }
    .inputs-row > * { flex:1; }
    .inputs-row .small-input { flex:0 0 80px; }
    .inputs-row .large-input { flex:1; }
    input, textarea { width:100%; border:none; border-radius: 6px; padding:8px; font-size: 14px; }
    textarea { min-height: 120px; resize: vertical; font-family: system-ui, sans-serif; background:#1a1a1a; color:#f2f2f2; }
    input::placeholder, textarea::placeholder { color:#aaa; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
    .sections-tabs { display:none; align-items:center; gap:6px; flex-wrap:wrap; }
    .sections-tabs-label { color:#ddd; font-size:12px; font-weight:700; }
    .sections-tabs-buttons { display:flex; gap:4px; flex-wrap:wrap; }
    .section-tab-btn { border:none; border-radius:6px; padding:2px 8px; font-size:12px; font-weight:700; cursor:pointer; background:#444; color:#eee; }
    .section-tab-btn:hover { background:#555; }
    .section-tab-btn.active { background: var(--gold); color:#222; }
    .btn-secondary { background:#444; color:#fff; }
    .btn-primary { background: var(--gold); color:#222; }
    .notes-btn { background: #293241; color: #fff; border: none; border-radius: 6px; padding: 4px 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
    .notes-btn:hover { background: #1f2735; }

    /* Page notepad overlay */
    #page-notes-overlay { display:none; position:fixed; inset:0; background: transparent; align-items:center; justify-content:center; z-index:10003; }
    #page-notes-overlay-content { background:#2a2a2a; border-radius:10px; padding:9px 10px 16px; width: 572px; max-width: calc(100vw - 16px); }
    #page-notes-text { width:100%; min-height: 325px; border:none; resize: vertical; padding:10px; background:#1a1a1a; color:#f2f2f2; border-radius:6px; }

    /* Video modal */
    #video-modal { display:none; position:fixed; inset:0; background: rgba(0,0,0,0.75); align-items:center; justify-content:center; z-index:10000; }
    #video-modal-content { background:#000; border-radius:12px; padding:14px; width:90%; max-width:900px; display:flex; flex-direction:column; position:relative; }
    #video-iframe { flex:1; min-height: 480px; border:none; border-radius:8px; }
    #video-close { align-self:flex-end; margin-top:8px; }
    #video-prompt { display:none; position:absolute; left:50%; transform:translateX(-50%); top:28%; background: rgba(0,0,0,0.65); color:#fff; padding:12px 16px; border-radius:10px; text-align:center; min-width:280px; }
    #video-prompt .btn { margin-left:6px; }
    /* Lists overlay */
    #lists-overlay { display:none; position:fixed; inset:0; background: rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:10001; }
    #lists-overlay-content { background:#222; border-radius:12px; padding:16px; width: 520px; max-width: 92%; color:#eee; max-height: 80vh; overflow:auto; }
    #lists-overlay h3 { margin:0 0 8px 0; color: var(--gold); font-size: 16px; text-align:center; }
    .lists-grid { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
    .lists-row { display:flex; align-items:center; gap:8px; }
    .lists-row input[type="checkbox"] { width:16px; height:16px; }
    .new-list-row { display:flex; gap:8px; margin-top:12px; }
    .lists-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }

    /* Audio page */
    .audio-page { width:min(900px, 100%); margin:20px auto 0; padding:18px; background:#202020; border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:#eee; }
    .audio-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .audio-toolbar h1 { margin:0 auto 0 0; color:var(--gold); font-size:20px; }
    .audio-add-toggle { width:38px; height:38px; border:0; border-radius:8px; background:#b42332; color:#fff; font-size:28px; line-height:1; cursor:pointer; }
    .audio-add-toggle:hover { background:#d12d3d; }
    .audio-refresh { border:1px solid rgba(255,255,255,0.2); border-radius:7px; padding:8px 11px; background:#353535; color:#fff; cursor:pointer; }
    .audio-refresh:hover { background:#454545; }
    .audio-player { width:100%; height:40px; margin-top:12px; }
    .audio-script-display { margin-top:10px; padding:10px 12px; border-left:3px solid var(--gold); border-radius:4px; background:#292929; line-height:1.5; overflow-wrap:anywhere; }
    .audio-script-body { white-space:pre-wrap; }
    .audio-script-original { color:#fff; }
    .audio-script-edited { color:var(--gold); }
    .audio-script-editor { min-height:180px; padding:10px; border:1px solid #555; border-radius:6px; background:#181818; color:#fff; font-size:14px; font-weight:400; line-height:1.5; }
    .audio-script-editor:focus-within { border-color:var(--gold); outline:1px solid var(--gold); }
    .audio-script-original-edit { min-height:1em; color:#fff; white-space:pre-wrap; overflow-wrap:anywhere; outline:none; }
    .audio-add-form { display:grid; grid-template-columns:minmax(150px,1fr) minmax(150px,1fr); gap:9px; margin-top:14px; padding:12px; background:#292929; border-radius:8px; }
    .audio-add-form[hidden] { display:none; }
    .audio-add-form label, .audio-edit-form label { display:flex; flex-direction:column; gap:5px; color:#ddd; font-size:13px; font-weight:600; }
    .audio-add-form input, .audio-add-form select, .audio-edit-form input, .audio-edit-form select { width:100%; min-width:0; padding:8px; border:1px solid #555; border-radius:6px; background:#181818; color:#fff; }
    .audio-add-form textarea, .audio-edit-form textarea { min-height:76px; }
    .audio-add-form .audio-script-field { grid-column:1 / -1; }
    .audio-form-actions { display:flex; justify-content:flex-end; gap:8px; grid-column:1 / -1; }
    .audio-items { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:14px; }
    .audio-item { display:flex; align-items:center; gap:3px; padding:3px; border:1px solid transparent; border-radius:8px; background:#303030; }
    .audio-item.selected { border-color:var(--gold); background:#403a22; }
    .audio-item-play { max-width:260px; border:0; padding:6px 9px; background:transparent; color:#fff; font:inherit; text-align:left; overflow-wrap:anywhere; cursor:pointer; }
    .audio-item-play:hover, .audio-item.selected .audio-item-play { color:var(--gold); }
    .audio-item-action { border:0; padding:5px; border-radius:5px; background:transparent; color:#bbb; font-size:12px; cursor:pointer; }
    .audio-item-action:hover, .audio-item-action:focus-visible { background:#505050; color:#fff; }
    .audio-status { min-height:1.4em; margin:10px 0 0; color:#facc15; font-size:13px; }
    .audio-empty { width:100%; margin:4px 0; color:#bbb; font-size:14px; }
    .audio-edit-overlay { display:none; position:fixed; inset:0; z-index:10005; align-items:center; justify-content:center; padding:12px; background:rgba(0,0,0,0.72); }
    .audio-edit-dialog { width:min(520px, 100%); max-height:calc(100dvh - 24px); overflow:auto; padding:16px; border-radius:10px; background:#242424; color:#eee; box-shadow:0 12px 40px rgba(0,0,0,0.55); }
    .audio-edit-dialog h2 { margin:0 0 14px; color:var(--gold); font-size:18px; }
    .audio-edit-form { display:flex; flex-direction:column; gap:12px; }
    .audio-edit-actions { display:flex; justify-content:flex-end; gap:8px; }
    .audio-item button:focus-visible, .audio-add-toggle:focus-visible, .audio-refresh:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
    @media (max-width:600px) {
      .audio-page { margin-top:14px; padding:12px; }
      .audio-toolbar h1 { font-size:18px; }
      .audio-add-form { grid-template-columns:1fr; }
      .audio-add-form .audio-script-field, .audio-form-actions { grid-column:auto; }
      .audio-items { gap:6px; }
      .audio-item { max-width:100%; }
      .audio-item-play { max-width:calc(100vw - 140px); }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div id="current-page-title" class="current-page-title"></div>
      <div id="page-tabs" class="page-tabs"></div>
      <button id="page-notes-btn" class="notes-btn" title="Page notepad">🔧</button>
      <button id="add-page-btn" class="btn btn-add">Add Page</button>
      <button id="check-mode-btn" class="btn btn-add">N</button>
      <button class="delete-mode-btn" id="delete-mode-btn">✕</button>
      <button class="confirm-delete-btn" id="confirm-delete-btn">+</button>
      <button class="arrow-btn" id="arrow-up" title="Move Up">↑</button>
      <button class="arrow-btn" id="arrow-down" title="Move Down">↓</button>
      <button class="arrow-btn" id="arrow-left" title="Move Left">←</button>
      <button class="arrow-btn" id="arrow-right" title="Move Right">→</button>
      <button class="arrow-btn" id="reset-now-btn" title="Reset Now">R</button>
      <button class="reset-page-btn" id="open-reset-page-btn" title="Open the reset version of this site">Reset Page</button>
    </div>

    <div class="columns" id="columns"></div>
    <section id="audio-page" class="audio-page" aria-labelledby="audio-page-title" hidden>
      <div class="audio-toolbar">
        <h1 id="audio-page-title">Audio</h1>
        <button id="audio-add-toggle" class="audio-add-toggle" type="button" aria-label="Add audio item" aria-expanded="false">+</button>
        <button id="audio-refresh" class="audio-refresh" type="button" aria-label="Refresh available audio files">↻ Refresh</button>
      </div>
      <audio id="audio-player" class="audio-player" controls preload="none" hidden></audio>
      <div id="audio-script-display" class="audio-script-display" hidden></div>
      <form id="audio-add-form" class="audio-add-form" hidden>
        <label>Title
          <input id="audio-add-title" type="text" maxlength="160" required placeholder="Audio title" />
        </label>
        <label>Audio file (optional)
          <select id="audio-add-file">
            <option value="">No audio file</option>
          </select>
        </label>
        <label class="audio-script-field">Script / notes (optional)
          <textarea id="audio-add-script" placeholder="Add a script or notes..."></textarea>
        </label>
        <div class="audio-form-actions">
          <button class="btn btn-secondary" id="audio-add-cancel" type="button">Cancel</button>
          <button class="btn btn-primary" id="audio-add-save" type="submit">Save audio</button>
        </div>
      </form>
      <div id="audio-items" class="audio-items" aria-live="polite"></div>
      <p id="audio-status" class="audio-status" role="status"></p>
    </section>

    <div id="audio-edit-overlay" class="audio-edit-overlay" aria-hidden="true">
      <section class="audio-edit-dialog" role="dialog" aria-modal="true" aria-labelledby="audio-edit-heading">
        <h2 id="audio-edit-heading">Edit audio</h2>
        <form id="audio-edit-form" class="audio-edit-form">
          <label>Title
            <input id="audio-edit-title" type="text" maxlength="160" required />
          </label>
          <label>Audio file (optional)
            <select id="audio-edit-file">
              <option value="">No audio file</option>
            </select>
          </label>
          <label>Script
            <div class="audio-script-editor">
              <div id="audio-edit-script" class="audio-script-original-edit" contenteditable="true" role="textbox" aria-label="Edit script" aria-multiline="true"></div>
            </div>
          </label>
          <div class="audio-edit-actions">
            <button class="btn btn-secondary" id="audio-edit-cancel" type="button">Cancel</button>
            <button class="btn btn-primary" id="audio-edit-save" type="submit">Save changes</button>
          </div>
        </form>
      </section>
    </div>
    <!-- Modal for creating/editing item -->
    <div id="modal">
      <div id="modal-content">
        <h3 id="modal-title">Edit Item</h3>
        <div class="inputs">
          <input type="text" id="inp-link" placeholder="Paste link (YouTube/Drive) or leave blank for plain text" />
          <input type="text" id="inp-title" placeholder="Title (use // to split parts, e.g. Warrior // Warrior 2)" />
          <input type="number" id="inp-thumb-frame" placeholder="Thumbnail frame (0-3 for YouTube)" min="0" max="3" step="1" />
          <input type="text" id="inp-preview-image" placeholder="Preview image URL (optional, overrides thumbnail)" />
          <input type="text" id="inp-sections" placeholder="Sections (split with //, e.g. 0:10-0:40 // 0:20-0:50)" />
          <div id="sections-tabs" class="sections-tabs">
            <span class="sections-tabs-label">Timestamp page</span>
            <div id="sections-tabs-buttons" class="sections-tabs-buttons"></div>
          </div>
          <input type="text" id="inp-description" placeholder="Description (optional)" />
          <textarea id="inp-notes" placeholder="Notes (optional)"></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="btn-delete" style="margin-right: auto;">Delete</button>
          <button class="btn btn-secondary" id="btn-cancel">Cancel</button>
          <button class="btn btn-primary" id="btn-save">Save</button>
        </div>
      </div>
    </div>
    
      <!-- Lists Overlay -->
      <div id="lists-overlay">
        <div id="lists-overlay-content">
          <h3>Add Item To Lists</h3>
          <div class="lists-grid" id="lists-grid"></div>
          <div class="new-list-row">
            <input type="text" id="new-list-name" placeholder="New list name" />
            <button class="btn btn-primary" id="btn-create-list">Create</button>
          </div>
          <div class="lists-actions">
            <button class="btn btn-secondary" id="btn-lists-cancel">Cancel</button>
            <button class="btn btn-primary" id="btn-lists-save">Save</button>
          </div>
        </div>
      </div>

      <!-- Page notes overlay -->
      <div id="page-notes-overlay">
        <div id="page-notes-overlay-content">
          <textarea id="page-notes-text" placeholder="Write notes for this page..."></textarea>
        </div>
      </div>

      <!-- Video Modal -->
    <div id="video-modal">
      <div id="video-modal-content">
        <iframe id="video-iframe" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        <div id="video-prompt">
          <span id="video-prompt-text">Section ended.</span>
          <button class="btn btn-primary" id="video-prompt-continue">Jump to next</button>
          <button class="btn btn-secondary" id="video-prompt-cancel">Keep paused</button>
        </div>
        <button class="btn btn-secondary" id="video-close">Close</button>
      </div>
    </div>
  </div>

  <script type="module">
    // Firebase, deleteField
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDocs, getDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCdzIu5PwO5KiZmdFCNCOvJY1R6JHgkKjM",
      authDomain: "birdfood-fda27.firebaseapp.com",
      projectId: "birdfood-fda27",
      storageBucket: "birdfood-fda27.firebasestorage.app",
      messagingSenderId: "340792097507",
      appId: "1:340792097507:web:f151f0076517cc2e0323d6"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const SITE_KEY = (urlParams.get("siteKey") || "").trim();
    const PAGES_COLLECTION = SITE_KEY ? `${SITE_KEY}_pages` : "pages";
    const NOTES_COLLECTION = SITE_KEY ? `${SITE_KEY}_notes` : "notes";
    const COLUMN_META_COLLECTION = SITE_KEY ? `${SITE_KEY}_columnMeta` : "columnMeta";
    const LISTS_COLLECTION = SITE_KEY ? `${SITE_KEY}_lists` : "lists";
    const AUDIO_COLLECTION = SITE_KEY ? `${SITE_KEY}_audio` : "audio";
    const PAGE_NOTES_COLLECTION = SITE_KEY ? `${SITE_KEY}_pageNotes` : "pageNotes";
    const LAST_PAGE_STORAGE_KEY = SITE_KEY ? `${SITE_KEY}_lastPage` : "lastPage";
    const PAGE_NOTES_DRAFT_KEY = SITE_KEY ? `${SITE_KEY}_pageNotesDraft` : "pageNotesDraft";
    const storedLastPage = !urlParams.has("page") ? safeLocalStorageGet(LAST_PAGE_STORAGE_KEY) : null;
    let PAGE = (urlParams.get("page") || (storedLastPage || (SITE_KEY ? "home" : "bird"))).trim() || (SITE_KEY ? "home" : "bird");

    function safeLocalStorageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (error) {
        return null;
      }
    }

    // Helpers
    function extractYouTubeID(url) {
      try {
        const u = new URL(url);
        if (u.hostname.includes("youtube.com")) return u.searchParams.get("v");
        if (u.hostname.includes("youtu.be")) return u.pathname.slice(1);
      } catch {}
      return null;
    }
    function extractGoogleDriveID(url) {
      try {
        const u = new URL(url);
        if (!u.hostname.includes("drive.google.com")) return null;
        let m = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (m) return m[1];
        m = url.match(/id=([a-zA-Z0-9-_]+)/);
        if (m) return m[1];
      } catch {}
      return null;
    }
    function getThumbnailUrl(link, thumbFrame, previewImage) {
      const customPreview = (previewImage || "").trim();
      if (customPreview) return customPreview;
      if (!link) return null;
      const ytId = extractYouTubeID(link);
      if (ytId) {
        let frame = Number.isInteger(thumbFrame) ? thumbFrame : parseInt(thumbFrame, 10);
        if (!Number.isInteger(frame) || frame < 0 || frame > 3) frame = 0;
        // Add query param so switching frames always triggers a fresh image request.
        return `https://img.youtube.com/vi/${ytId}/${frame}.jpg?frame=${frame}`;
      }
      const gdId = extractGoogleDriveID(link);
      if (gdId) return `https://drive.google.com/thumbnail?id=${gdId}`;
      return null;
    }
    function timeToSeconds(str) {
      const s = (str || "").trim();
      if (!s) return 0;
      if (/^\d+$/.test(s)) return parseInt(s, 10);
      if (s.includes(":")) { const [m, sec] = s.split(":"); return parseInt(m,10)*60 + parseInt(sec,10); }
      return 0;
    }
    function secondsToTime(sec) {
      if (!sec || sec === 0) return "";
      const minutes = Math.floor(sec / 60);
      const seconds = sec % 60;
      return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
    }
    function parseSections(sectionsString) {
      const sections = [];
      if (!sectionsString) return sections;
      const parts = sectionsString.trim().split(",").map(p => p.trim()).filter(Boolean);
      let lastEnd = -1; // -1 means no previous section yet
      
      for (let i=0;i<parts.length;i++) {
        const raw = parts[i];
        const autoSkip = raw.endsWith("$");
        const t = autoSkip ? raw.slice(0,-1).trim() : raw;
        
        if (t.includes("-")) {
          const [startStr, endStr] = t.split("-");
          const startSec = startStr ? timeToSeconds(startStr) : 0;
          const endSec = endStr && endStr.trim() ? timeToSeconds(endStr) : 999999;
          
          // Add gap before this section if needed (but not before the first section)
          if (lastEnd >= 0 && startSec > lastEnd) {
            sections.push({start: lastEnd, end: startSec, autoSkip: true, isGap: true});
          }
          
          sections.push({start: startSec, end: endSec, autoSkip, isGap: false});
          lastEnd = endSec;
        } else {
          const mark = timeToSeconds(t);
          
          // Add gap before this marker if needed (but not before the first section)
          if (lastEnd >= 0 && mark > lastEnd) {
            sections.push({start: lastEnd, end: mark, autoSkip: true, isGap: true});
          }
          
          sections.push({start: mark, end: 999999, autoSkip, isGap: false});
          lastEnd = 999999;
        }
      }
      return sections;
    }

    function splitInlineParts(raw) {
      return String(raw || "")
        .split(/\s*\/\/\s*/)
        .map((v) => v.trim())
        .filter(Boolean);
    }

    function getTitlePartsCount(titleValue) {

    function saveCurrentSectionPageDraft() {

    function normalizeSectionPagesCount(targetCount) {
      const count = Math.max(1, Number(targetCount) || 1);
      if (!Array.isArray(sectionPages) || sectionPages.length === 0) {
        sectionPages = [""];
      }
      if (sectionPages.length < count) {
        const fill = sectionPages[sectionPages.length - 1] || "";
        while (sectionPages.length < count) sectionPages.push(fill);
      }
      if (sectionPages.length > count) {
        sectionPages = sectionPages.slice(0, count);
      }
      if (activeSectionPage >= sectionPages.length) {
        activeSectionPage = sectionPages.length - 1;
      }
      if (activeSectionPage < 0) activeSectionPage = 0;
    }

    function getInlineTitleSections(it) {
      if (!it || it.title2 !== undefined) return [];
      const rawTitle = String(it.title || "").trim();
      const rawSections = String(it.sections || "").trim();
      if (!rawTitle.includes("//") && !rawSections.includes("//")) return [];

      const titleParts = splitInlineParts(rawTitle);
      const sectionParts = splitInlineParts(rawSections);
      const partCount = Math.max(titleParts.length, sectionParts.length);
      if (partCount <= 1) return [];

      const out = [];
      for (let i = 0; i < partCount; i++) {
        const fallbackTitle = titleParts[titleParts.length - 1] || "!";
        const title = (titleParts[i] || fallbackTitle || "!").trim();
        const fallbackSections = sectionParts[sectionParts.length - 1] || "";
        const sections = (sectionParts[i] || fallbackSections || "").trim();
        out.push({ title, sections });
      }
      return out;
    }

    async function renamePage(oldName, newName) {
      const trimmedNew = (newName || "").trim();
      if (!trimmedNew || trimmedNew === oldName) return;

      const oldPageSnap = await getDoc(doc(db, PAGES_COLLECTION, oldName));
      const existingOrder = oldPageSnap.exists() ? Number(oldPageSnap.data().order) : null;

      // Create/update new page record, then remove old page record.
      await setDoc(doc(db, PAGES_COLLECTION, trimmedNew), { name: trimmedNew, ...(Number.isFinite(existingOrder) ? { order: existingOrder } : {}) }, { merge: true });
      await deleteDoc(doc(db, PAGES_COLLECTION, oldName));

      // Move all notes to the renamed page.
      const notesQ = query(collection(db, NOTES_COLLECTION), where("page", "==", oldName));
      const notesSnap = await getDocs(notesQ);
      for (const d of notesSnap.docs) {
        await setDoc(doc(db, NOTES_COLLECTION, d.id), { page: trimmedNew }, { merge: true });
      }

      // Move all column metadata to the renamed page.
      const metaQ = query(collection(db, COLUMN_META_COLLECTION), where("page", "==", oldName));
      const metaSnap = await getDocs(metaQ);
      const metaRows = metaSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
      for (const row of metaRows) {
        const colIdx = Number(row.col ?? 0);
        const newId = `${trimmedNew}_${colIdx}`;
        await setDoc(doc(db, COLUMN_META_COLLECTION, newId), { page: trimmedNew, col: colIdx, title: row.title || "" }, { merge: true });
        if (row.id !== newId) await deleteDoc(doc(db, COLUMN_META_COLLECTION, row.id));
      }

      PAGE = trimmedNew;
      if (activeTitleEdit && activeTitleEdit.type === "page") {
        activeTitleEdit.pageName = trimmedNew;
      }
      updatePageTitleUI();
      await loadPages();
      await loadPageItems();
    }

    async function deletePage(pageName) {
      const allPagesSnap = await getDocs(collection(db, PAGES_COLLECTION));
      const pageNames = [];
      allPagesSnap.forEach((d) => {
        const name = d.data().name;
        if (name) pageNames.push(name);
      });
      if (pageNames.length <= 1) {
        alert("You need at least one page.");
        return;
      }

      const notesQ = query(collection(db, NOTES_COLLECTION), where("page", "==", pageName));
      const metaQ = query(collection(db, COLUMN_META_COLLECTION), where("page", "==", pageName));
      const [notesSnap, metaSnap] = await Promise.all([getDocs(notesQ), getDocs(metaQ)]);
      for (const d of notesSnap.docs) {
        await deleteDoc(doc(db, NOTES_COLLECTION, d.id));
      }
      for (const d of metaSnap.docs) {
        await deleteDoc(doc(db, COLUMN_META_COLLECTION, d.id));
      }
      await deleteDoc(doc(db, PAGES_COLLECTION, pageName));

      const remaining = pageNames.filter((n) => n !== pageName).sort((a, b) => a.localeCompare(b));
      PAGE = remaining[0] || (SITE_KEY ? "home" : "bird");
      updatePageTitleUI();
      await loadPages();
      await loadPageItems();

    async function copySelectedItemToPage(targetPage) {

      if (String(selectedMoveItem).startsWith("tmp_")) return false;

      const sourceRef = doc(db, NOTES_COLLECTION, selectedMoveItem);
      const sourceSnap = await getDoc(sourceRef);
      if (!sourceSnap.exists()) return false;

      const sourceItem = sourceSnap.data();
      const targetNotesQ = query(collection(db, NOTES_COLLECTION), where("page", "==", targetPage));
      const targetNotesSnap = await getDocs(targetNotesQ);
      let minOrderInCol0 = 0;
      targetNotesSnap.forEach((d) => {
        const it = d.data();
        if ((it.col ?? 0) === 0) {
          minOrderInCol0 = Math.min(minOrderInCol0, it.order ?? 0);
        }
      });

      const newId = `${targetPage}_${Date.now()}`;
      const copiedItem = {
        ...sourceItem,
        page: targetPage,
        col: 0,
        order: minOrderInCol0 - 1
      };
      delete copiedItem.id;
      await setDoc(doc(db, NOTES_COLLECTION, newId), copiedItem);
      selectedMoveItem = newId;
      await switchPage(targetPage);
      return true;

    async function loadPages() {
      const snap = await getDocs(collection(db, PAGES_COLLECTION));
      if (snap.empty) {
        if (SITE_KEY) {
          // Initialize isolated site with one blank page
          await setDoc(doc(db, PAGES_COLLECTION, PAGE), { name: PAGE, order: 0 });
        } else {
          // Initialize default shared pages
          await setDoc(doc(db, PAGES_COLLECTION, "adrian"), { name: "adrian", order: 0 });
          await setDoc(doc(db, PAGES_COLLECTION, "bird"), { name: "bird", order: 1 });
          PAGE = "bird";
        }
        return loadPages();
      }
      const pageRows = [];
      snap.forEach(d => {
        const data = d.data();
        const name = (data.name || d.id || "").trim();
        if (!name) return;
        const parsedOrder = Number(data.order);
        pageRows.push({ id: d.id, name, order: Number.isFinite(parsedOrder) ? parsedOrder : null });
      });
      // Add a virtual 'Lists' page to the UI (does not require a DB page row)
      const orderedPages = getOrderedPages(pageRows);
      let pageNames = orderedPages.map((r) => r.name);
      // Remove legacy 'Now' page from UI and replace with 'Lists'
      pageNames = pageNames.filter(n => n !== 'Now');
      if (!pageNames.includes('Lists')) pageNames.push('Lists');
      if (!pageNames.includes('Audio')) pageNames.push('Audio');
      if (!pageNames.includes(PAGE)) {
        PAGE = pageNames[0];
      }

      pageTabs.innerHTML = "";
      pageNames.forEach((name) => {
        const tab = document.createElement("button");
        tab.className = "page-tab" + (name === PAGE ? " active" : "");
        tab.textContent = name;
        tab.addEventListener("click", async () => {
          if (tab.dataset.editing === "1") return;
          if (name === PAGE) return;
          if (selectedMoveItem && PAGE !== "Audio" && name !== "Audio") {
            const copied = await copySelectedItemToPage(name);
            if (copied) return;
          }
          await switchPage(name);
        });
        attachPageTitleLongPress(tab, name);
        pageTabs.appendChild(tab);
      });

      updatePageTitleUI();

      if (activeTitleEdit && activeTitleEdit.type === "page") {
        const activePageName = activeTitleEdit.pageName;
        const editHost = activePageName === PAGE
          ? currentPageTitle
          : Array.from(pageTabs.children).find((el) => el.textContent === activePageName);
        if (editHost && editHost.dataset.editing !== "1") {
          startPageTitleInlineEdit(editHost, activePageName);
        }
      }
    }

    function populateAudioFileSelect(select, selectedFile = "") {
      select.replaceChildren(new Option("No audio file", ""));
      if (selectedFile && !availableAudioFiles.includes(selectedFile)) {
        select.appendChild(new Option(`${selectedFile} (not currently available)`, selectedFile));
      }
      availableAudioFiles.forEach((fileName) => {
        const option = new Option(fileName, fileName);
        select.appendChild(option);
      });
      select.value = selectedFile || "";
    }

    async function refreshAvailableAudioFiles() {
      try {
        const response = await fetch(new URL("audio/index.json", window.location.href), { cache: "no-store" });
        if (!response.ok) throw new Error(`Audio inventory request returned ${response.status}.`);
        const files = await response.json();
        if (!Array.isArray(files) || files.some((name) =>
          typeof name !== "string" ||
          name !== name.split(/[\\/]/).pop() ||
          !/\.(mp3|ogg|wav|m4a|aac)$/i.test(name)
        )) {
          throw new Error("Audio inventory must be a list of supported audio filenames.");
        }
        availableAudioFiles = [...new Set(files)];
        audioFilesError = "";
      } catch (error) {
        audioFilesError = "Couldn't load available audio files. Check audio/index.json and refresh.";
        console.error("Unable to load available audio files:", error);
      }
      populateAudioFileSelect(audioAddFile, audioAddFile.value);
      populateAudioFileSelect(audioEditFile, audioEditFile.value);
    }

    function audioFileUrl(fileName) {
      const encodedName = fileName.split("/").map(encodeURIComponent).join("/");
      return new URL(`audio/${encodedName}`, window.location.href).href;
    }

    function stopAudioPlayback() {
      audioPlayer.pause();
    }

    function renderAudioTracks() {
      audioItemsDiv.replaceChildren();
      if (!audioTracks.length) {
        const emptyMessage = document.createElement("p");
        emptyMessage.className = "audio-empty";
        emptyMessage.textContent = "No saved audio yet. Use + to add an item.";
        audioItemsDiv.appendChild(emptyMessage);
        return;
      }

      audioTracks.forEach((track) => {
        const item = document.createElement("div");
        item.className = "audio-item" + (track.id === selectedAudioId ? " selected" : "");
        item.dataset.id = track.id;

        const playButton = document.createElement("button");
        playButton.type = "button";
        playButton.className = "audio-item-play";
        playButton.textContent = track.title || "Untitled audio";
        playButton.setAttribute("aria-pressed", String(track.id === selectedAudioId));
        playButton.setAttribute("aria-label", `Play ${track.title || "audio item"}; use Shift+F10 or the context menu to edit`);
        playButton.setAttribute("aria-keyshortcuts", "Shift+F10");
        playButton.title = track.audioFile
          ? `Play ${track.title}. Right-click to edit; hold right-click for 2 seconds to delete.`
          : "No audio file attached. Right-click to edit; hold right-click for 2 seconds to delete.";
        playButton.addEventListener("click", () => playAudioTrack(track));
        let deleteTimer = null;
        let longPressTriggered = false;
        let suppressContextMenu = false;
        playButton.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          if (suppressContextMenu) {
            suppressContextMenu = false;
            return;
          }
          openAudioEdit(track);
        });

        playButton.addEventListener("pointerdown", (event) => {
          if (event.button !== 2 || event.pointerType !== "mouse") return;
          longPressTriggered = false;
          suppressContextMenu = false;
          deleteTimer = setTimeout(async () => {
            longPressTriggered = true;
            suppressContextMenu = true;
          }, 2000);
        });
        playButton.addEventListener("pointerup", () => {
          if (deleteTimer) clearTimeout(deleteTimer);
          deleteTimer = null;
          if (longPressTriggered) {
            longPressTriggered = false;
            deleteAudioTrack(track);
          }
        });
        ["pointerleave", "pointercancel"].forEach((type) => {
          playButton.addEventListener(type, () => {
            if (deleteTimer) clearTimeout(deleteTimer);
            deleteTimer = null;
            longPressTriggered = false;
            suppressContextMenu = false;
          });
        });
        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "audio-item-action";
        deleteButton.textContent = "×";
        deleteButton.title = "Delete audio";
        deleteButton.setAttribute("aria-label", `Delete ${track.title || "audio item"}`);
        deleteButton.addEventListener("click", async () => {
          if (window.confirm(`Delete "${track.title || "Untitled audio"}"?`)) {
            await deleteAudioTrack(track);

        item.append(playButton, deleteButton);
        audioItemsDiv.appendChild(item);

    async function loadAudioPage() {
      audioStatus.textContent = "Loading audio items and available files...";
      await Promise.all([
        refreshAvailableAudioFiles(),
        (async () => {
          const snapshot = await getDocs(collection(db, AUDIO_COLLECTION));
          audioTracks = snapshot.docs
            .map((audioDoc) => ({ id: audioDoc.id, ...audioDoc.data() }))
            .filter((item) => item.kind === "audio-track")
            .sort((a, b) => Number(a.createdAt || 0) - Number(b.createdAt || 0));
        })()
      ]).then(() => {
        renderAudioTracks();
        audioStatus.textContent = audioFilesError;
      }).catch((error) => {
        renderAudioTracks();
        audioStatus.textContent = "Couldn't load saved audio. Check the Firestore permissions.";
        console.error("Unable to load saved audio items:", error);
      });
      audioPlayer.hidden = !audioPlayer.src;

    async function playAudioTrack(track) {
      const wasSelected = selectedAudioId === track.id;
      selectedAudioId = track.id;
      audioItemsDiv.querySelectorAll(".audio-item").forEach((item) => {
        const selected = item.dataset.id === track.id;
        item.classList.toggle("selected", selected);
        item.querySelector(".audio-item-play").setAttribute("aria-pressed", String(selected));
      });
      renderAudioScript(track);
      if (!track.audioFile) {
        stopAudioPlayback();
        audioPlayer.removeAttribute("src");
        audioPlayer.load();
        audioPlayer.hidden = true;
        audioStatus.textContent = track.script || track.scriptAdditions
          ? "This item has no audio file. Its script and notes are shown above."
          : "This item has no audio file attached. Right-click it to add one.";
        return;
      }
      const source = audioFileUrl(track.audioFile);
      if (wasSelected && audioPlayer.src === source && !audioPlayer.paused) {
        audioPlayer.pause();
        audioStatus.textContent = `Paused: ${track.title}`;
        return;
      }
      if (audioPlayer.src !== source) {
        audioPlayer.src = source;
      }
      audioPlayer.hidden = false;
      audioStatus.textContent = `Loading: ${track.title}`;
      audioPlayer.play().catch((error) => {
        if (selectedAudioId !== track.id) return;
        audioStatus.textContent = `Couldn't play "${track.title}". Check that the audio file is available.`;
        console.error("Unable to play audio item:", error);
      });
    }

    function renderAudioScript(track) {
      const segments = getAudioScriptSegments(track);
      audioScriptDisplay.replaceChildren();
      if (segments.length) {
        const body = document.createElement("div");
        body.className = "audio-script-body";
        renderAudioScriptSegments(body, segments);
        audioScriptDisplay.appendChild(body);
      }
      audioScriptDisplay.hidden = segments.length === 0;
    }

    function getAudioScriptAdditions(track) {
      if (Array.isArray(track.scriptAdditions)) {
        return track.scriptAdditions.filter((addition) => typeof addition === "string" && addition.trim());
      }
      return typeof track.scriptAdditions === "string" && track.scriptAdditions.trim()
        ? [track.scriptAdditions]
        : [];
    }

    function getAudioScriptSegments(track) {
      if (Array.isArray(track.scriptContent)) {
        return mergeAudioScriptSegments(track.scriptContent.filter((segment) =>
          segment && typeof segment.text === "string" && typeof segment.edited === "boolean"
        ));
      }
      const segments = [];
      if (typeof track.script === "string" && track.script) {
        segments.push({ text: track.script, edited: false });
      }
      getAudioScriptAdditions(track).forEach((addition) => {
        segments.push({ text: `${segments.length ? "\n" : ""}${addition}`, edited: true });
      });
      return mergeAudioScriptSegments(segments);
    }

    function mergeAudioScriptSegments(segments) {
      return segments.reduce((merged, segment) => {
        if (!segment.text) return merged;
        const last = merged[merged.length - 1];
        if (last && last.edited === segment.edited) last.text += segment.text;
        else merged.push({ text: segment.text, edited: segment.edited });
        return merged;
      }, []);
    }

    function renderAudioScriptSegments(container, segments) {
      container.replaceChildren();
      mergeAudioScriptSegments(segments).forEach((segment) => {
        const text = document.createTextNode(segment.text);
        if (!segment.edited) {
          container.appendChild(text);
          return;
        }
        const edited = document.createElement("span");
        edited.className = "audio-script-edited";
        edited.appendChild(text);
        container.appendChild(edited);
      });
      if (!container.hasChildNodes()) container.appendChild(document.createTextNode(""));
    }

    function getAudioScriptText(segments) {
      return segments.map((segment) => segment.text).join("");
    }

    function sliceAudioScriptSegments(segments, start, end) {
      let offset = 0;
      const sliced = [];
      segments.forEach((segment) => {
        const segmentStart = offset;
        const segmentEnd = offset + segment.text.length;
        const sliceStart = Math.max(start, segmentStart);
        const sliceEnd = Math.min(end, segmentEnd);
        if (sliceStart < sliceEnd) {
          sliced.push({
            text: segment.text.slice(sliceStart - segmentStart, sliceEnd - segmentStart),
            edited: segment.edited
          });
        }
        offset = segmentEnd;
      });
      return sliced;
    }

    function getAudioEditCaretOffset() {
      const selection = window.getSelection();
      if (!selection || !selection.focusNode || !audioEditScript.contains(selection.focusNode)) return audioEditText.length;
      const range = document.createRange();
      range.selectNodeContents(audioEditScript);
      range.setEnd(selection.focusNode, selection.focusOffset);
      return range.toString().length;
    }

    function setAudioEditCaretOffset(offset) {
      const walker = document.createTreeWalker(audioEditScript, NodeFilter.SHOW_TEXT);
      let node = walker.nextNode();
      let remaining = offset;
      let lastNode = null;
      while (node) {
        lastNode = node;
        if (remaining <= node.textContent.length) {
          const range = document.createRange();
          range.setStart(node, remaining);
          range.collapse(true);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          return;
        }
        remaining -= node.textContent.length;
        node = walker.nextNode();
      }
      if (!lastNode) {
        lastNode = document.createTextNode("");
        audioEditScript.appendChild(lastNode);
      }
      const range = document.createRange();
      range.setStart(lastNode, lastNode.textContent.length);
      range.collapse(true);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function insertAudioEditText(text) {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      range.deleteContents();
      const textNode = document.createTextNode(text);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
      updateAudioEditSegments();
    }

    function updateAudioEditSegments() {
      const caretOffset = getAudioEditCaretOffset();
      const newText = audioEditScript.textContent.replace(/\r\n?/g, "\n");
      let prefixLength = 0;
      while (prefixLength < audioEditText.length && prefixLength < newText.length &&
          audioEditText[prefixLength] === newText[prefixLength]) {
        prefixLength += 1;
      }
      let suffixLength = 0;
      while (suffixLength < audioEditText.length - prefixLength &&
          suffixLength < newText.length - prefixLength &&
          audioEditText[audioEditText.length - suffixLength - 1] === newText[newText.length - suffixLength - 1]) {
        suffixLength += 1;
      }
      const changedText = newText.slice(prefixLength, newText.length - suffixLength);
      audioEditSegments = mergeAudioScriptSegments([
        ...sliceAudioScriptSegments(audioEditSegments, 0, prefixLength),
        ...(changedText ? [{ text: changedText, edited: true }] : []),
        ...sliceAudioScriptSegments(audioEditSegments, audioEditText.length - suffixLength, audioEditText.length)
      ]);
      audioEditText = newText;
      renderAudioScriptSegments(audioEditScript, audioEditSegments);
      setAudioEditCaretOffset(caretOffset);
    }

    function openAudioEdit(track) {
      editingAudioTrack = track;
      audioEditTitle.value = track.title || "";
      populateAudioFileSelect(audioEditFile, track.audioFile || "");
      audioEditSegments = getAudioScriptSegments(track);
      audioEditText = getAudioScriptText(audioEditSegments);
      renderAudioScriptSegments(audioEditScript, audioEditSegments);
      audioEditOverlay.style.display = "flex";
      audioEditOverlay.setAttribute("aria-hidden", "false");
      audioEditTitle.focus();
    }

    function closeAudioEdit() {
      audioEditOverlay.style.display = "none";
      audioEditOverlay.setAttribute("aria-hidden", "true");
      editingAudioTrack = null;
    }

    async function deleteAudioTrack(track) {
      try {
        await deleteDoc(doc(db, AUDIO_COLLECTION, track.id));
        if (selectedAudioId === track.id) {
          stopAudioPlayback();
          audioPlayer.removeAttribute("src");
          audioPlayer.load();
          audioPlayer.hidden = true;
          selectedAudioId = null;
          audioScriptDisplay.replaceChildren();
          audioScriptDisplay.hidden = true;
        }
        if (editingAudioTrack?.id === track.id) closeAudioEdit();
        audioTracks = audioTracks.filter((item) => item.id !== track.id);
        renderAudioTracks();
        audioStatus.textContent = `Deleted "${track.title || "Untitled audio"}".`;
      } catch (error) {
        audioStatus.textContent = "Couldn't delete the audio item. Check the Firestore permissions.";
        console.error("Unable to delete audio item:", error);
      }
    }

    audioAddToggle.addEventListener("click", () => {
      audioAddForm.hidden = !audioAddForm.hidden;
      audioAddToggle.setAttribute("aria-expanded", String(!audioAddForm.hidden));
      if (!audioAddForm.hidden) audioAddTitle.focus();
    });
    audioAddTitle.addEventListener("input", () => {

    });
    audioAddFile.addEventListener("change", () => {

    audioRefresh.addEventListener("click", async () => {

      audioRefresh.disabled = false;
    });
    audioEditCancel.addEventListener("click", closeAudioEdit);
    audioEditScript.addEventListener("input", updateAudioEditSegments);
    audioEditScript.addEventListener("beforeinput", (event) => {
      if (event.inputType !== "insertParagraph" && event.inputType !== "insertLineBreak") return;
      event.preventDefault();
      insertAudioEditText("\n");
    });
    audioEditScript.addEventListener("paste", (event) => {
      event.preventDefault();
      const text = event.clipboardData.getData("text/plain").replace(/\r\n?/g, "\n");
      insertAudioEditText(text);
    });
    audioEditOverlay.addEventListener("click", (event) => {
      if (event.target === audioEditOverlay) closeAudioEdit();
    });
    audioEditForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!editingAudioTrack) return;
      audioEditSave.disabled = true;
      const title = audioEditTitle.value.trim();
      const update = {
        kind: "audio-track",
        title,
        audioFile: audioEditFile.value,
        script: audioEditText,
        scriptAdditions: [],
        scriptContent: audioEditSegments,
        updatedAt: Date.now()
      };
      try {
        await setDoc(doc(db, AUDIO_COLLECTION, editingAudioTrack.id), update, { merge: true });
        audioTracks = audioTracks.map((track) => track.id === editingAudioTrack.id ? { ...track, ...update } : track);
        if (selectedAudioId === editingAudioTrack.id) {
          const updatedTrack = audioTracks.find((track) => track.id === editingAudioTrack.id);
          renderAudioScript(updatedTrack);
        }
        if (selectedAudioId === editingAudioTrack.id && audioPlayer.src &&
            audioEditFile.value && audioPlayer.src !== audioFileUrl(audioEditFile.value)) {
          stopAudioPlayback();
          audioPlayer.src = audioFileUrl(audioEditFile.value);
        } else if (selectedAudioId === editingAudioTrack.id && !audioEditFile.value) {
          stopAudioPlayback();
          audioPlayer.removeAttribute("src");
          audioPlayer.load();
          audioPlayer.hidden = true;
        }
        closeAudioEdit();
        renderAudioTracks();
        audioStatus.textContent = `Saved changes to "${title}".`;
      } catch (error) {
        audioStatus.textContent = "Couldn't update the audio item. Check the Firestore permissions.";
        console.error("Unable to update audio item:", error);

        audioEditSave.disabled = false;
      }

    async function loadPageItems() {
      console.log("Loading page items for:", PAGE);
      if (PAGE === "Audio") {
        columnsDiv.hidden = true;
        audioPage.hidden = false;
        await loadAudioPage();
        return;
      }
      columnsDiv.hidden = false;
      audioPage.hidden = true;
      if (PAGE === 'Lists') {
        await loadListsPage();
        return;
      }
      columnsDiv.innerHTML = "";
      itemButtons.clear();
      // Build rows from Firestore
      const q = query(collection(db, NOTES_COLLECTION), where("page","==", PAGE));
      const metaQ = query(collection(db, COLUMN_META_COLLECTION), where("page","==", PAGE));
      const [snap, metaSnap] = await Promise.all([getDocs(q), getDocs(metaQ)]);
      const rows = new Map();
      const rowTitles = new Map();
      metaSnap.forEach(d => {
        const meta = d.data();
        const rowIdx = Number(meta.col ?? 0);
        rowTitles.set(rowIdx, meta.title || "");
      });
      snap.forEach(d => {
        const it = d.data(); it.id = d.id;
        const row = it.col ?? 0;
        if (!rows.has(row)) rows.set(row, []);
        rows.get(row).push(it);
      });
      // sort each row by order (left to right)
      [...rows.keys()].forEach(k => rows.get(k).sort((a,b) => (a.order??0)-(b.order??0)));

      console.log("Found rows:", rows.size);
      
      // render rows
      if (rows.size===0) {
        console.log("No rows found, creating default row");
        const { col: rowEl, addBtn } = createColumn(0, 0, rowTitles.get(0) || "");
        rowEl.appendChild(addBtn);
        if (!SITE_KEY) {
          // Keep legacy behavior on the shared dataset.
          rowEl.insertBefore(renderItem({ id: `tmp_${Date.now()}`, title:"!", isText:false, order:0, col:0 }), addBtn);
        }
        columnsDiv.appendChild(rowEl);
        // Add row addition button
        const addRowBtn = document.createElement("button");
        addRowBtn.className = "btn btn-add add-row-btn";
        addRowBtn.textContent = "+ Add Row";
        addRowBtn.addEventListener("click", async () => {
          await addColumnRight(0);
        });
        columnsDiv.appendChild(addRowBtn);
        console.log("Default row created");
        return;
      }
      const allRowIdx = new Set([...rows.keys(), ...rowTitles.keys()]);
      const maxRowIdx = Math.max(...allRowIdx);
      for (let rowIdx = 0; rowIdx <= maxRowIdx; rowIdx++) {
        const items = rows.get(rowIdx) || [];
        const { col: rowEl, addBtn } = createColumn(rowIdx, maxRowIdx, rowTitles.get(rowIdx) || "");
        rowEl.appendChild(addBtn);
        items.forEach(it => {
          const itemEl = renderItem(it);
          rowEl.insertBefore(itemEl, addBtn);
        });
        columnsDiv.appendChild(rowEl);
      }

      // Add button to add new row at the bottom
      const addRowBtn = document.createElement("button");
      addRowBtn.className = "btn btn-add add-row-btn";
      addRowBtn.textContent = "+ Add Row";
      addRowBtn.addEventListener("click", async () => {
        await addColumnRight(maxRowIdx);
      });
      columnsDiv.appendChild(addRowBtn);
    }

    function openListsOverlayForItem(itemId) {

      const newListInput = document.getElementById('new-list-name');
      const createBtn = document.getElementById('btn-create-list');
      const cancelBtn = document.getElementById('btn-lists-cancel');
      const saveBtn = document.getElementById('btn-lists-save');

    function createColumn(colIdx, maxColIdx, columnTitle = "") {
      const col = document.createElement("div");
      col.className = "column";
      col.dataset.col = colIdx;

      // Create add button for end of row
      const addBtn = document.createElement("button");
      addBtn.className = "btn btn-add column-add-btn";
      addBtn.textContent = "+";
      addBtn.title = deleteMode ? "Delete this row" : "Click to select random video, hold 1.5s to add new video";
      
      let holdTimer = null;
      let isLongPress = false;
      
      addBtn.addEventListener("mousedown", (e) => {
        if (deleteMode) return;
        isLongPress = false;
        holdTimer = setTimeout(async () => {
          isLongPress = true;
          // Create new video after 1.5s hold
          const items = Array.from(col.querySelectorAll('.item'));
          let refItem = null;
          if (items.length > 0) {
            const lastItem = items[items.length - 1];
            refItem = {
              id: lastItem.dataset.id,
              col: parseInt(lastItem.dataset.col),
              order: parseInt(lastItem.dataset.order)
            };
          } else {
            refItem = { col: colIdx, order: -1 };
          }
          await addItemBelow(refItem, false);
        }, 1500);
      });
      
      addBtn.addEventListener("mouseup", () => {
        clearTimeout(holdTimer);
      });
      
      addBtn.addEventListener("mouseleave", () => {
        clearTimeout(holdTimer);
      });
      
      addBtn.addEventListener("click", async (e) => {
        e.preventDefault();
        if (isLongPress) {
          isLongPress = false;
          return;
        }
        if (deleteMode) {
          await deleteColumn(colIdx);
          return;
        }
        // Click: play a random video from this row
        const items = Array.from(col.querySelectorAll('.item'));
        if (items.length > 0) {
          const randomItem = items[Math.floor(Math.random() * items.length)];
          const itemId = randomItem.dataset.id;
          
          // Get the item data to play it
          const itemDoc = await getDoc(doc(db, NOTES_COLLECTION, itemId));
          if (itemDoc.exists()) {
            const it = itemDoc.data();
            // Play the video if it has a link
            if (it.link && (it.link.includes("youtube.com") || it.link.includes("youtu.be"))) {
              const vid = extractYouTubeID(it.link);
              if (vid) openVideoEmbed(vid, 0, 0, it.sections||"");
            } else if (it.link) {
              window.open(it.link, "_blank");
            }
          }
        }
      });

      return { col, addBtn };
    }

    async function moveColumn(colIdx, direction) {
      const targetCol = colIdx + direction;
      if (targetCol < 0) return;

      const notesQ = query(collection(db, NOTES_COLLECTION), where("page", "==", PAGE));
      const metaQ = query(collection(db, COLUMN_META_COLLECTION), where("page", "==", PAGE));
      const [notesSnap, metaSnap] = await Promise.all([getDocs(notesQ), getDocs(metaQ)]);

      const maxColInNotes = notesSnap.docs.reduce((max, d) => Math.max(max, Number(d.data().col ?? 0)), 0);
      const maxColInMeta = metaSnap.docs.reduce((max, d) => Math.max(max, Number(d.data().col ?? 0)), 0);
      const maxCol = Math.max(maxColInNotes, maxColInMeta);
      if (targetCol > maxCol) return;

      for (const d of notesSnap.docs) {
        const itemCol = Number(d.data().col ?? 0);
        if (itemCol === colIdx) {
          await setDoc(doc(db, NOTES_COLLECTION, d.id), { col: targetCol }, { merge: true });
        } else if (itemCol === targetCol) {
          await setDoc(doc(db, NOTES_COLLECTION, d.id), { col: colIdx }, { merge: true });
        }
      }

      const titleByCol = new Map();
      metaSnap.forEach((d) => {
        const data = d.data();
        titleByCol.set(Number(data.col ?? 0), data.title || "");
      });
      const currentTitle = titleByCol.get(colIdx) || "";
      const targetTitle = titleByCol.get(targetCol) || "";
      await saveColumnTitle(colIdx, targetTitle);
      await saveColumnTitle(targetCol, currentTitle);

      activeTitleEdit = { type: "column", colIdx: targetCol };
      await loadPageItems();
    }

    async function deleteColumn(colIdx) {
      const notesQ = query(collection(db, NOTES_COLLECTION), where("page", "==", PAGE));
      const metaQ = query(collection(db, COLUMN_META_COLLECTION), where("page", "==", PAGE));
      const [notesSnap, metaSnap] = await Promise.all([getDocs(notesQ), getDocs(metaQ)]);

      // Notes: delete target column, shift columns on the right left by one.
      for (const d of notesSnap.docs) {
        const it = d.data();
        const itemCol = it.col ?? 0;
        if (itemCol === colIdx) {
          await deleteDoc(doc(db, NOTES_COLLECTION, d.id));
        } else if (itemCol > colIdx) {
          await setDoc(doc(db, NOTES_COLLECTION, d.id), { col: itemCol - 1 }, { merge: true });
        }
      }

      // Column metadata: remove target, re-key shifted columns.
      const metaRows = metaSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
      for (const row of metaRows) {
        const metaCol = Number(row.col ?? 0);
        if (metaCol === colIdx) {
          await deleteDoc(doc(db, COLUMN_META_COLLECTION, row.id));
        }
      }
      for (const row of metaRows) {
        const metaCol = Number(row.col ?? 0);
        if (metaCol > colIdx) {
          const newCol = metaCol - 1;
          const newId = `${PAGE}_${newCol}`;
          await setDoc(doc(db, COLUMN_META_COLLECTION, newId), { page: PAGE, col: newCol, title: row.title || "" }, { merge: true });
          if (row.id !== newId) {
            await deleteDoc(doc(db, COLUMN_META_COLLECTION, row.id));
          }
        }
      }

      await loadPageItems();
    }

        // Long-press on second part to edit

        secondPart.addEventListener("mousedown", (e) => { 
          e.stopPropagation();
          lpTo2 = setTimeout(()=>openEditModal(it, true), 1000); 
        });
        ["mouseup","mouseleave"].forEach(ev => secondPart.addEventListener(ev, () => { clearTimeout(lpTo2); }));
        
        titleEl.appendChild(firstPart);
        titleEl.appendChild(separator);
        titleEl.appendChild(secondPart);
      } else if (inlineTitleSections.length > 1) {
        inlineTitleSections.forEach((part, index) => {

          partEl.style.cursor = "pointer";
          partEl.addEventListener("click", (e) => {

        // Long-pressing the title should edit, not select/move the whole item.
        let titleLpTo;
        let isTitleLongPress = false;
        titleEl.addEventListener("mousedown", (e) => {
          e.stopPropagation();
          isTitleLongPress = false;
          titleLpTo = setTimeout(() => {
            isTitleLongPress = true;
            openEditModal(it, false);
            setTimeout(() => { isTitleLongPress = false; }, 100);
          }, 1000);
        });
        ["mouseup","mouseleave"].forEach(ev => titleEl.addEventListener(ev, () => {
          clearTimeout(titleLpTo);
        }));
        titleEl.addEventListener("click", (e) => {
          if (isTitleLongPress) {
            e.preventDefault();
            e.stopPropagation();
          }
        });
      }

      titleRow.appendChild(titleEl);

      const thumbUrl = getThumbnailUrl(it.link, it.thumbFrame, it.previewImage);

        img.className = "item-thumbnail";
        img.alt = "Thumbnail";
        thumbWrap.appendChild(img);
        wrap.appendChild(thumbWrap);

      // Click behavior for the whole item
      let lpTo;
      let suppressClickUntil = 0;
      wrap.addEventListener("click", (e) => {
        e.preventDefault();

        if (checkMode) return;

        if (Date.now() < suppressClickUntil) {
          return;
        }
        
        if (deleteMode) {
          // Toggle selection for deletion
          if (selectedItems.has(it.id)) {
            selectedItems.delete(it.id);
            wrap.style.background = '';
          } else {
            selectedItems.add(it.id);
            wrap.style.background = '#ff0000';
          }
          return;
        }
        
        // If split content exists, clicking is handled by individual parts.
        if (it.title2 !== undefined || inlineTitleSections.length > 1) return;
        
        if (!it.link && (!it.title || it.title === "!")) {
          openEditModal(it);
          return;
        }
        // Link item: YouTube/Drive open/embedded
        if (it.link && (it.link.includes("youtube.com") || it.link.includes("youtu.be"))) {
          const vid = extractYouTubeID(it.link);
          if (vid) openVideoEmbed(vid, 0, 0, it.sections||"");
        } else if (it.link) {
          window.open(it.link, "_blank");
        }
      });

      // Double click to edit
      wrap.addEventListener("dblclick", (e) => {
        e.preventDefault();
        if (deleteMode || checkMode) return;
        openEditModal(it);
      });

      // Long-press to select for move (1s)
      wrap.addEventListener("mousedown", (e) => { 
        if (deleteMode || checkMode) return;
        if (it.title2 !== undefined) return; // Don't trigger if has title2
        lpTo = setTimeout(()=> {
          suppressClickUntil = Date.now() + 600;
          // Long press only selects for moving (never deselects current one)
          if (selectedMoveItem !== it.id) {
            // Deselect previous visual selection
            if (selectedMoveItem) {
              const prevWrap = document.querySelector(`[data-id="${selectedMoveItem}"]`);
              if (prevWrap) prevWrap.classList.remove("move-selected");
            }
            // Select this item
            selectedMoveItem = it.id;
            wrap.classList.add("move-selected");
            console.log("Item selected for moving:", it.id);
          }
        }, 1000); 
      });
      ["mouseup","mouseleave"].forEach(ev => wrap.addEventListener(ev, () => { 
        clearTimeout(lpTo);
      }));

      return wrap;
    }

    async function addItemBelow(refItem, groupBefore) {
      const colIdx = refItem.col ?? 0;
      const refOrder = refItem.order ?? 0;
      // Shift all items after this one down by 1
      const q = query(collection(db, NOTES_COLLECTION), where("page","==", PAGE));
      const snap = await getDocs(q);
      const itemsToUpdate = [];
      snap.forEach(d => {
        const it = d.data();
        if ((it.col ?? 0) === colIdx && (it.order ?? 0) > refOrder) {
          itemsToUpdate.push({ id: d.id, newOrder: (it.order ?? 0) + 1 });
        }
      });
      // Update orders
      for (const item of itemsToUpdate) {
        await setDoc(doc(db, NOTES_COLLECTION, item.id), { order: item.newOrder }, { merge: true });
      }
      // Insert new item right after refItem
      const id = `${PAGE}_${Date.now()}`;
      const newItem = { id, page: PAGE, col: colIdx, order: refOrder + 1, title: "!", isText:false };
      if (groupBefore) newItem.groupBefore = true;
      await setDoc(doc(db, NOTES_COLLECTION, id), newItem);
      await loadPageItems();
      // Open modal for new item
      const newDoc = await getDoc(doc(db, NOTES_COLLECTION, id));
      if (newDoc.exists()) {
        const newItemData = newDoc.data();
        newItemData.id = newDoc.id;
        openEditModal(newItemData);
      }
    }
    async function addItemRight(refItem) {
      const colIdx = (refItem.col ?? 0) + 1;

      await loadPageItems();
